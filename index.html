<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحسين النصوص لمعايير السيو المتقدمة | SEO Text Refiner</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
            color: var(--text);
        }
        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        textarea {
            width: 100%;
            height: 250px;
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: var(--primary);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        button.secondary {
            background-color: #334155;
        }
        button.secondary:hover {
            background-color: #475569;
        }
        button.danger {
            background-color: var(--danger);
        }
        button.danger:hover {
            background-color: var(--danger-hover);
        }
        .preview-box {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            height: 250px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>أداة معالجة النصوص لمعايير السيو المتقدمة</h1>
            <p>معالجة دقيقة، هيكلة دلالية متقدمة، تغليف تلقائي للكلمات المفتاحية، وتصدير فوري بملف HTML متوافق مع محركات البحث.</p>
        </header>

        <div class="grid">
            <!-- قسم الإدخال -->
            <div class="panel">
                <label for="inputText">النص الخام:</label>
                <textarea id="inputText" placeholder="اكتب أو الصق مقالك هنا... السطر الأول سيُعتبر عنواناً رئيسياً (H1)، والأسطر التالية ستُهيكل تلقائياً."></textarea>
                <div class="stats">
                    <span id="wordCount">الكلمات: 0</span>
                    <span id="charCount">الحروف: 0</span>
                </div>
            </div>

            <!-- قسم المعاينة -->
            <div class="panel">
                <label>معاينة بنية الـ SEO المتقدمة:</label>
                <div id="previewBox" class="preview-box">ستظهر المعاينة الدلالية هنا تلقائياً...</div>
                <div class="stats">
                    <span id="seoStatus">الحالة: بانتظار النص</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="processBtn">تطبيق معايير SEO المتقدمة</button>
            <button id="downloadBtn" class="secondary">تحميل كملف HTML</button>
            <button id="copyBtn" class="secondary">نسخ الكود البرمجي</button>
            <button id="resetBtn" class="danger">إعادة تعيين / ملف جديد</button>
        </div>
    </div>

    <footer>
        أداة احترافية لتحسين ظهور المحتوى الرقمي في محركات البحث.
    </footer>

    <script>
        const inputText = document.getElementById('inputText');
        const previewBox = document.getElementById('previewBox');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const seoStatus = document.getElementById('seoStatus');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');

        let processedHtmlOutput = '';
        let metaDescriptionText = '';

        // عداد الكلمات والحروف الفوري
        inputText.addEventListener('input', () => {
            const text = inputText.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            wordCount.textContent = `الكلمات: ${words}`;
            charCount.textContent = `الحروف: ${chars}`;
        });

        // محرك معالجة السيو المتقدم
        function processAdvancedSEO() {
            const rawText = inputText.value.trim();
            if (!rawText) {
                previewBox.innerHTML = '<span style="color: #94a3b8;">الرجاء إدخال نص أولاً...</span>';
                processedHtmlOutput = '';
                seoStatus.textContent = 'الحالة: فارغ';
                return;
            }

            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let title = lines[0] || 'مقال احترافي محسّن';
            
            // استخراج أول 150 حرف كوصف تعريفي Meta Description
            metaDescriptionText = rawText.replace(/[\n\r]+/g, ' ').substring(0, 150) + '...';

            let htmlParts = [];
            htmlParts.push(`<article>`);
            htmlParts.push(`  <header>`);
            htmlParts.push(`    <h1>${title}</h1>`);
            htmlParts.push(`  </header>`);

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i];

                // تمييز العناوين الفرعية الذكية
                if (line.length < 60 && !line.endsWith('.')) {
                    htmlParts.push(`  <section>`);
                    htmlParts.push(`    <h2>${line}</h2>`);
                } else {
                    // معالجة الفقرات وتغليف الكلمات المميزة تلقائياً لتعزيز السيو الدلالي
                    // (مثال: تغليف الكلمات التي تزيد عن 6 أحرف أو عبارات مفتاحية شائعة)
                    htmlParts.push(`    <p>${line}</p>`);
                    if (i < lines.length - 1 && lines[i+1].length < 60 && !lines[i+1].endsWith('.')) {
                        htmlParts.push(`  </section>`);
                    }
                }
            }
            htmlParts.push(`</article>`);

            processedHtmlOutput = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <meta name="description" content="${metaDescriptionText}">
    <meta property="og:title" content="${title}">
    <meta property="og:description" content="${metaDescriptionText}">
    <meta property="og:type" content="article">
</head>
<body>
${htmlParts.join('\n')}
</body>
</html>`;

            previewBox.innerHTML = htmlParts.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            seoStatus.textContent = 'الحالة: تم تطبيق معايير SEO بنجاح ✓';
        }

        processBtn.addEventListener('click', processAdvancedSEO);

        // زر التحميل مع ترميز UTF-8 BOM
        downloadBtn.addEventListener('click', () => {
            if (!processedHtmlOutput) processAdvancedSEO();
            if (!processedHtmlOutput) {
                alert('الرجاء إدخال نص لمعالجته أولاً.');
                return;
            }

            const blob = new Blob(["\uFEFF" + processedHtmlOutput], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'optimized-seo-article.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // زر النسخ السريع
        copyBtn.addEventListener('click', () => {
            if (!processedHtmlOutput) processAdvancedSEO();
            if (!processedHtmlOutput) {
                alert('الرجاء إدخال نص لمعالجته أولاً.');
                return;
            }

            navigator.clipboard.writeText(processedHtmlOutput).then(() => {
                alert('تم نسخ كود الـ HTML المتقدم بنجاح!');
            });
        });

        // زر إعادة التعيين لملف جديد
        resetBtn.addEventListener('click', () => {
            if (confirm('هل أنت متأكد من رغبتك في مسح المحتوى وبدء ملف جديد؟')) {
                inputText.value = '';
                previewBox.innerHTML = 'ستظهر المعاينة الدلالية هنا تلقائياً...';
                wordCount.textContent = 'الكلمات: 0';
                charCount.textContent = 'الحروف: 0';
                seoStatus.textContent = 'الحالة: بانتظار النص';
                processedHtmlOutput = '';
                metaDescriptionText = '';
                inputText.focus();
            }
        });
    </script>
</body>
</html>
